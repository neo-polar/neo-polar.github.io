<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Polar — Promotion Film Thumbnail</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+JP:wght@500;700&family=Shippori+Mincho:wght@600;700;800&display=block" rel="stylesheet" />
  <link rel="stylesheet" href="thumbnail.css" />
</head>
<body>
  <!-- 1280×720 YouTube thumbnail: the logo's dot is the pole star the sky turns around. -->
  <div id="thumb">
    <canvas id="sky" width="1280" height="720"></canvas>
    <span class="corner tl"></span><span class="corner tr"></span>
    <span class="corner bl"></span><span class="corner br"></span>
    <p class="label"><span class="label-mark"></span>OFFICIAL PROMOTION FILM</p>
    <h1 class="tagline"><span class="warm">熱意</span>で知を研ぎ澄ます</h1>
    <p class="sub">複数ジャンル横断型クリエイティブ組織</p>
  </div>
  <script src="thumbnail.js"></script>
</body>
</html>
